[package]
name = "SASE"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "sase"
path = "src/main.rs"

[dependencies]
tun2 = { version = "4.0", features = ["async"] }
tokio = { version = "1.40", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
etherparse = "0.19.0"
log = "0.4"
env_logger = "0.11"
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
socket2 = "0.5"
libc = "0.2"
async-trait = "0.1"
tokio-util = { version = "0.7", features = ["codec", "net"] }
futures = "0.3"
bytes = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
url = "2.5"
