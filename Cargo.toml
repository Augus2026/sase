[package]
name = "SASE"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "sase"
path = "src/main.rs"

[dependencies]
tun2 = { version = "4.0", features = ["async"] }
tokio = { version = "1.40", features = ["full"] }
etherparse = "0.19.0"
log = "0.4"
env_logger = "0.11"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
socket2 = "0.5"
libc = "0.2"
