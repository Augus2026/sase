[package]
name = "SASE"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "sase_server"
path = "src/server/main.rs"

[[bin]]
name = "sase_client"
path = "src/client/main.rs"

[dependencies]
tun2 = "1.0"
tokio = { version = "1.40", features = ["full"] }
etherparse = "0.15"
log = "0.4"
env_logger = "0.11"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
